# Module de langue : Fulfulde d'Adamaoua (fub), experimental
code: fub
code_nllb: fuv_Latn
nom: "Fulfulde (Adamaoua)"
statut: experimental
variete: "Fulfulde d'Adamaoua (le modele NLLB couvre la variete nigeriane fuv_Latn)"
traduction:
  # llm : modele de langage (comme le Pidgin), avec le glossaire. nllb : NLLB-200, facultatif (transformers, torch).
  moteur: llm
  pre_simplification: true
# Consigne en plus pour le modele. Aucune donnee linguistique n'est ecrite ici : seulement des regles de prudence.
consigne: >-
  La cible est le Fulfulde parle en Adamaoua (Cameroun), en alphabet latin. Cette langue est peu documentee : n'invente pas.
  Utilise d'abord les termes du glossaire. Si tu n'es pas sur d'un mot ou d'une phrase, mets "confiance_moteur" a "faible"
  plutot que de deviner. Ne remplace jamais un mot que tu ne connais pas par du francais ou de l'anglais en le faisant passer
  pour du Fulfulde. Phrases tres courtes.
voix:
  moteur: mms_tts
  modele: facebook/mms-tts-ful
  repli: fr
glossaire: glossaires/fulfulde.csv
mapping_confiance:
  elevee: elevee
  moyenne: moyenne
  faible: moyenne
  tres_faible: faible
# Une traduction du moteur ne depasse jamais cette confiance
plafond_confiance: moyenne
