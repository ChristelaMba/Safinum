<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon Argent Mobile - cadre d'une autre origine (démo SAFINUM)</title>
    <link rel="stylesheet" href="../commun/style.css">
  </head>
  <body>
    <div class="appli">
      <header class="entete">
        <h1 class="marque">Espace client</h1>
        <p class="sous-titre">Le cadre ci-dessous vient d'une autre origine : SAFINUM ne peut pas le lire et doit le signaler.</p>
      </header>
      <main class="contenu">
        <h2>Votre banque en ligne</h2>
        <iframe id="cadre" title="Parcours d'un autre domaine" style="width: 100%; height: 700px; border: 1px solid #c6d3cf"></iframe>
      </main>
    </div>
    <script>
      // localhost et 127.0.0.1 sont deux origines differentes
      var autre = location.hostname === "localhost" ? "127.0.0.1" : "localhost";
      document.getElementById("cadre").src = location.protocol + "//" + autre + ":" + location.port + "/banque/banque_simple/index.html";
    </script>
  </body>
</html>
