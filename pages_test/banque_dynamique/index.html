<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon Argent Mobile - contenu dynamique (démo SAFINUM)</title>
    <link rel="stylesheet" href="../commun/style.css">
    <style>
      #toasts { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 416px; margin: 0 auto; }
      .toast { margin-bottom: 8px; padding: 12px; color: #ffffff; background: #14201f; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="toasts" aria-live="polite"></div>
    <div class="appli">
      <header class="entete">
        <h1 class="marque">Mon Argent Mobile</h1>
        <p class="sous-titre">Contenu qui change : notifications, minuterie, heure, chargement différé.</p>
        <nav class="menu" aria-label="Menu principal"></nav>
      </header>
      <section class="contenu">
        <p class="message">Votre session expire dans <span id="minuterie">00:59</span>.</p>
        <p class="discret">Heure du serveur : <span id="horloge"></span></p>
        <p class="discret">Opérations en direct : <span id="rapide">0</span></p>
        <button type="button" class="action secondaire" id="notifier">Simuler une notification</button>
        <div id="differe"></div>
      </section>
      <main id="contenu" class="contenu" tabindex="-1"></main>
    </div>
    <script src="../commun/jeu.js"></script>
    <script src="app.js"></script>
      <script src="../commun/auto.js"></script>
  </body>
</html>
